<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glow1" x1="150" y1="80" x2="650" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg1)"/>
  <circle cx="400" cy="250" r="190" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="400" cy="250" r="130" stroke="url(#glow1)" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  
  <!-- Central AI Core -->
  <rect x="315" y="165" width="170" height="170" rx="36" fill="#0F172A" stroke="url(#glow1)" stroke-width="4"/>
  <rect x="345" y="205" width="110" height="70" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="375" cy="240" r="11" fill="#38BDF8"/>
  <circle cx="425" cy="240" r="11" fill="#38BDF8"/>
  <path d="M375 298 H425" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="325" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">OLLAMA + PYTHON AI</text>

  <!-- WhatsApp Node -->
  <g transform="translate(80, 90)">
    <rect width="165" height="90" rx="18" fill="#064E3B" fill-opacity="0.85" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="42" cy="45" r="22" fill="#10B981"/>
    <text x="42" y="52" text-anchor="middle" fill="#064E3B" font-family="system-ui, sans-serif" font-size="20" font-weight="900">WA</text>
    <text x="76" y="40" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="15" font-weight="700">WhatsApp</text>
    <text x="76" y="60" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12">Evolution 10001</text>
  </g>
  <path d="M245 135 L315 205" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Email Node -->
  <g transform="translate(80, 320)">
    <rect width="165" height="90" rx="18" fill="#1E3A8A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="42" cy="45" r="22" fill="#38BDF8"/>
    <text x="42" y="52" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="900">@</text>
    <text x="76" y="40" fill="#EFF6FF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Correo IA</text>
    <text x="76" y="60" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12">IMAP / SMTP 24/7</text>
  </g>
  <path d="M245 365 L315 295" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Teams Node -->
  <g transform="translate(555, 90)">
    <rect width="165" height="90" rx="18" fill="#312E81" fill-opacity="0.85" stroke="#818CF8" stroke-width="2.5"/>
    <circle cx="42" cy="45" r="22" fill="#818CF8"/>
    <text x="42" y="52" text-anchor="middle" fill="#1E1B4B" font-family="system-ui, sans-serif" font-size="20" font-weight="900">T</text>
    <text x="76" y="40" fill="#EEF2FF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">MS Teams</text>
    <text x="76" y="60" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12">Webhook Activo</text>
  </g>
  <path d="M555 135 L485 205" stroke="#818CF8" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Orders Closed Node -->
  <g transform="translate(555, 320)">
    <rect width="165" height="90" rx="18" fill="#3B0764" fill-opacity="0.85" stroke="#F472B6" stroke-width="2.5"/>
    <circle cx="42" cy="45" r="22" fill="#F472B6"/>
    <text x="42" y="52" text-anchor="middle" fill="#3B0764" font-family="system-ui, sans-serif" font-size="18" font-weight="900">✓</text>
    <text x="76" y="40" fill="#FDF2F8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cierra Ventas</text>
    <text x="76" y="60" fill="#FBCFE8" font-family="system-ui, sans-serif" font-size="12">Crea Pedidos SQL</text>
  </g>
  <path d="M555 365 L485 295" stroke="#F472B6" stroke-width="3" stroke-dasharray="6 4"/>
</svg>
